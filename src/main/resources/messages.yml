prefix: '<#FF0368>[BiteDisplays] '
error-prefix: '<#F7567C>!! '
# Messages support MiniMessage and legacy codes (&a, &l, &#FF0368).
# Variables:
# - <label> = command label.
# - <action> = the command used, like glow.
# - <types> = the types an action works on, from the types-plural section below.
# - <type> = entity type, from the types section below.
# - <id> = entity ID, like npc-1.
# - <name> = NPC or display name, with its formatting.
# - <description> = NPC description, with its formatting.
# - <command> = click command.
# - <runner> = who runs the click command, from the runners section below.
# - <sound> = click sound.
# - <color> = glow or background color.
# - <player> = player whose skin is used.
# - <axis> = yaw or pitch.
# - <degrees> = rotation in degrees.
# - <size> = entity scale.
# - <min>, <max> = the NPC size limits.
# - <line> = text display line number.
# - <lines> = number of lines on a text display.
# - <count> = number of entities (or lines, in info.list-lines).
# - <range> = selection range in blocks.
# - <world>, <x>, <y>, <z> = entity location.
# - <select> = the info.list-select button (left out in the console).
# - <value>, <details>, <yaw>, <pitch> = entity details in the info section.

types:
  npc: 'NPC'
  item: 'item display'
  block: 'block display'
  text: 'text display'

# In errors.unsupported, like "NPCs, item displays and block displays"
types-plural:
  npc: 'NPCs'
  item: 'item displays'
  block: 'block displays'
  text: 'text displays'
  # Goes between the last two
  and: ' and '

runners:
  console: 'the console'
  player: 'the player'

