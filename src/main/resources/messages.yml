prefix: '<#FF0368>[BiteEntities] '
error-prefix: '<#F7567C>!! '
# Variables:
# - <label> = command label.
# - <type> = entity type, from the types section below.
# - <id> = short entity ID, like 1a2b3c4d.
# - <name> = NPC or display name, with its formatting.
# - <description> = NPC description, with its formatting.
# - <command> = click command.
# - <sound> = click sound.
# - <color> = glow or background color.
# - <player> = player whose skin is used.
# - <axis> = yaw or pitch.
# - <degrees> = rotation in degrees.
# - <size> = display scale.
# - <line> = text display line number.
# - <lines> = number of lines on a text display.
# - <count> = number of entities (or lines, in info.list-lines).
# - <range> = selection range in blocks.
# - <world>, <x>, <y>, <z> = entity location.
# - <value>, <details>, <yaw>, <pitch> = entity details in the info section.

types:
  npc: 'NPC'
  item: 'item display'
  block: 'block display'
  text: 'text display'

